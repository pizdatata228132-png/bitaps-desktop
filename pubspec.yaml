name: bitaps_vpn
description: bitaps VPN — десктоп/мобильный клиент (Windows/Linux/Android)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  window_manager: ^0.3.7
  url_launcher: ^6.2.5
  open_file: ^3.5.10
  device_info_plus: ^11.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  tray_manager: ^0.5.3
  # QR-пейринг (кабинет): показать QR ключа/кода входа + реф-QR (только рисование, без камеры)
  qr_flutter: ^4.1.0
  # share-sheet ключа «Отправить на другое устройство» (нативный на iOS/Android/macOS; фолбэк — копирование)
  share_plus: ^10.1.4
  # deep-link bitaps://import?key=… / bitaps://login?secret=… — приём кастомной схемы
  app_links: ^6.3.2
  # автозапуск при входе (десктоп) — 2 тумблера в Настройках
  launch_at_startup: ^0.5.1
  # глобальный хоткей подключения (десктоп) + рекордер в Настройках
  hotkey_manager: ^0.2.3
  # нужен launch_at_startup на macOS/Windows для определения пути к бинарю
  package_info_plus: ^8.1.2
  # Google Play Billing — покупка подписки ИЗ ПРИЛОЖЕНИЯ (требование Play для цифровых подписок).
  # Модель: разовые managed-продукты (sub_mo/sub_q/sub_h/sub_yr) — как наши предоплаченные тарифы,
  # не auto-renew. Верификация — серверная (edge google-play-verify), consume после гранта.
  in_app_purchase: ^3.2.3
  # sha256(tgId) → applicationUserName покупки: привязка purchaseToken к аккаунту (сверка на edge)
  crypto: ^3.0.7
  # Android: xray-core внутри VpnService. Именно xray, а не sing-box, потому что узлы «белого
  # списка» ходят транспортом xhttp, которого в sing-box нет. Пакет принимает СЫРОЙ xray-конфиг —
  # тот же, что мы собираем для десктопа. Android-часть бесплатна и под MIT.
  flutter_v2ray_client: ^3.4.1

# Заморозка jni на 1.0.0.
# jni приходит транзитивно (path_provider_android → jni_flutter → jni). В версии 1.0.1 её
# gradle-скрипт вызывает kotlin { … } на своём модуле, а шаблон Flutter плагин Kotlin
# подпроектам не подключает — сборка Android падает на «Could not find method kotlin()».
# От нашего кода это не зависит: чистый проект без единой нашей правки падает так же.
# Снять, когда jni починят выше по течению (проверяется одной сборкой).
dependency_overrides:
  jni: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/gear.png
    - assets/gearring.png
    # трей-иконки (tray_manager резолвит ассет-пути): png — macOS (template) / Linux, ico — Windows
    - assets/tray.png
    - assets/tray.ico
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

# macOS здесь СОЗНАТЕЛЬНО не включён: генератор кладёт квадрат без скруглений/полей,
# а Dock показывает asset как есть. Мастер — assets/icon_macos.png (скруглённый квадрат
# 824/1024 по HIG); macos/ не в git, поэтому после flutter create --platforms=macos
# разложить его в AppIcon.appiconset: sips -z N N assets/icon_macos.png (N=16…1024).
# iOS тоже НЕ здесь: CI создаёт только windows/android (ios/ нет → генератор падает,
# уронил run 84). iOS-иконки генерятся локально из отдельного конфига:
#   dart run flutter_launcher_icons -f icons-ios.yaml
flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#0C0A14"
  adaptive_icon_foreground: "assets/icon_fg.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
