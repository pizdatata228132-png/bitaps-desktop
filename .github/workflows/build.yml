name: build-desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Релиз latest один на все платформы: два прогона одновременно перезаписывали его ассеты
# в произвольном порядке (уже ловили испорченный build_number.txt в раздаче). Теперь строго
# по очереди; текущий прогон не прерываем — релиз недопустимо резать посередине.
concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  # ЕДИНЫЙ монотонный номер сборки. github.run_number сам по себе НЕЛЬЗЯ: он стартует с 1,
  # а на устройствах уже стоят сборки с BUILD_NUMBER 147 и android versionCode 2146 —
  # низкий номер = Android отказывается ставить обновление, а приложение считает себя
  # «новее» серверного и не зовёт обновиться. Арифметики в выражениях Actions НЕТ
  # (прогон с «${{ 2144 + github.run_number }}» в env упал ещё до джобов — валидация),
  # поэтому считаем шеллом здесь и раздаём всем джобам через outputs.
  # run_number не убывает и не сбрасывается (пока файл workflow не переименуют — тогда
  # базу 2144 поднять вручную выше последнего выданного номера).
  prep:
    runs-on: ubuntu-latest
    outputs:
      bn: ${{ steps.bn.outputs.bn }}
    steps:
      - id: bn
        run: echo "bn=$((2144 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

  # Быстрый гейт качества перед сборками: анализатор + юнит-тесты (генератор конфига туннеля
  # и разбор подписки). Платформенные каркасы для этого не нужны — только pub get.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # infos не роняют релиз — блокируют только настоящие ошибки компиляции/анализа
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Гейт настоящим движком: генерируем конфиг из фикстуры подписки и проверяем xray'ем.
      # Регрессия генератора или несовместимость с бинарём ловятся здесь, а не у пользователя.
      - name: Конфиг → настоящий xray run -test
        run: |
          ver=v26.3.27
          sha=23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
          curl -sSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/$ver/Xray-linux-64.zip"
          echo "$sha  xray.zip" | sha256sum -c -
          unzip -o -q xray.zip -d xray-tmp
          dart run tool/check_config.dart test/fixtures/subscription-live.json > /tmp/bitaps-cfg.json
          XRAY_LOCATION_ASSET=xray-tmp xray-tmp/xray run -test -c /tmp/bitaps-cfg.json

  windows:
    needs: [test, prep]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter create --org com.bitapsvpn --platforms=windows,android --project-name bitaps_vpn .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      # VERSIONINFO в exe: шаблон flutter create подставляет org/имя проекта
      # (CompanyName=com.bitapsvpn, ProductName=bitaps_vpn). У «безымянного» бинаря нет ни
      # издателя, ни репутации — SmartScreen и Chrome относятся к нему заметно строже.
      # windows/ в git не хранится, поэтому патчим Runner.rc здесь, до сборки.
      - name: VERSIONINFO (издатель/продукт/версия) в Runner.rc
        shell: pwsh
        run: |
          $rc = "windows\runner\Runner.rc"
          if (-not (Test-Path $rc)) { throw "$rc не найден — шаблон flutter create изменился" }
          # Версия приложения из pubspec.yaml (version: X.Y.Z+N), 4-е число — номер прогона
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if (-not $ver) { throw "версия из pubspec.yaml не разобрана" }
          $comma = $ver -replace '\.', ','
          $c = Get-Content $rc -Raw
          $c = $c -replace '#define VERSION_AS_NUMBER .*', "#define VERSION_AS_NUMBER $comma,${{ needs.prep.outputs.bn }}"
          $c = $c -replace '#define VERSION_AS_STRING .*', "#define VERSION_AS_STRING `"$ver.${{ needs.prep.outputs.bn }}`""
          $c = $c -replace 'VALUE "CompanyName", "[^"]*"', 'VALUE "CompanyName", "bitaps"'
          $c = $c -replace 'VALUE "FileDescription", "[^"]*"', 'VALUE "FileDescription", "bitaps VPN Client"'
          $c = $c -replace 'VALUE "ProductName", "[^"]*"', 'VALUE "ProductName", "bitaps VPN"'
          $c = $c -replace 'VALUE "LegalCopyright", "[^"]*"', 'VALUE "LegalCopyright", "Copyright (C) 2026 bitaps"'
          Set-Content $rc $c -NoNewline
          foreach ($needle in @('CompanyName", "bitaps"', 'FileDescription", "bitaps VPN Client"', 'ProductName", "bitaps VPN"', "VERSION_AS_NUMBER $comma")) {
            if (-not (Select-String -Path $rc -Pattern ([regex]::Escape($needle)) -Quiet)) { throw "VERSIONINFO не применён: $needle" }
          }
          Select-String -Path $rc -Pattern 'CompanyName|ProductName|FileDescription|LegalCopyright|VERSION_AS_'
      - run: flutter build windows --release --dart-define=BUILD_NUMBER=${{ needs.prep.outputs.bn }}
      # VPN-движок кладём РЯДОМ с исполняемым файлом: приложение ищет его там (desktop_engine.dart).
      # Версия и контрольная сумма закреплены (см. pkg/THIRD-PARTY.md) — молча подменённый бинарь
      # движка означал бы чужой код в туннеле пользователя.
      - name: VPN-движок (xray) в сборку
        shell: pwsh
        run: |
          $ver = "v26.3.27"
          $sha = "d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad"
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$ver/Xray-windows-64.zip" -OutFile xray.zip
          $got = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "xray checksum mismatch: $got" }
          Expand-Archive xray.zip -DestinationPath xray-tmp -Force
          $dest = "build\windows\x64\runner\Release"
          Copy-Item xray-tmp\xray.exe "$dest\xray.exe"
          # geoip.dat/geosite.dat обязательны: без них правила «РФ — мимо туннеля» не работают
          Copy-Item xray-tmp\geoip.dat "$dest\geoip.dat"
          Copy-Item xray-tmp\geosite.dat "$dest\geosite.dat"
          Copy-Item xray-tmp\LICENSE "$dest\XRAY-LICENSE.txt"
          Copy-Item pkg\THIRD-PARTY.md "$dest\THIRD-PARTY.md"
          foreach ($f in @("xray.exe","geoip.dat","geosite.dat")) {
            if (-not (Test-Path "$dest\$f")) { throw "$f not packaged" }
          }
      # ПОДПИСЬ КОДА (SmartScreen): если в секретах лежит Authenticode-сертификат
      # (WINDOWS_CERT_BASE64 = base64 .pfx, WINDOWS_CERT_PASSWORD), подписываем exe приложения,
      # движок и дальше установщик — без подписи Windows пугает пользователя «неизвестным
      # издателем». Секрета нет — собираем как раньше, без подписи (мягкий фолбэк).
      - name: Подписать exe (если есть сертификат)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_B64)) { echo "сертификата нет — пропускаю подпись"; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:CERT_B64))
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $st) { throw "signtool не найден на раннере" }
          $dest = "build\windows\x64\runner\Release"
          foreach ($f in @("$dest\bitaps_vpn.exe", "$dest\xray.exe")) {
            & $st sign /fd SHA256 /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:CERT_PASS /tr http://timestamp.digicert.com /td SHA256 /d "bitaps VPN" $f
            if ($LASTEXITCODE -ne 0) { throw "подпись $f не удалась ($LASTEXITCODE)" }
            & $st verify /pa $f | Out-Null
          }
          Remove-Item "$env:RUNNER_TEMP\codesign.pfx" -Force
          echo "exe подписаны"
      - name: Portable zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath bitaps-windows-x64.zip -Force
      # Версия установщика из pubspec + общий номер сборки BN (тот же приём, что у VERSIONINFO):
      # иначе в «Установке и удалении программ» вечно висит 1.0.0 из pkg/installer.iss.
      - name: AppVersion в installer.iss из pubspec
        shell: pwsh
        run: |
          $iss = "pkg\installer.iss"
          if (-not (Test-Path $iss)) { throw "$iss не найден" }
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if (-not $ver) { throw "версия из pubspec.yaml не разобрана" }
          $c = Get-Content $iss -Raw
          $c = $c -replace '(?m)^AppVersion=.*', "AppVersion=$ver.${{ needs.prep.outputs.bn }}"
          Set-Content $iss $c -NoNewline
          if (-not (Select-String -Path $iss -Pattern ([regex]::Escape("AppVersion=$ver.${{ needs.prep.outputs.bn }}")) -Quiet)) { throw "AppVersion не применён" }
          Select-String -Path $iss -Pattern '^AppVersion='
      - name: Installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" pkg\installer.iss'
      # Установщик подписываем ОТДЕЛЬНО после сборки: SmartScreen смотрит подпись скачанного файла.
      - name: Подписать установщик (если есть сертификат)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_B64)) { echo "сертификата нет — пропускаю подпись"; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:CERT_B64))
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $st sign /fd SHA256 /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:CERT_PASS /tr http://timestamp.digicert.com /td SHA256 /d "bitaps VPN" bitaps-setup.exe
          if ($LASTEXITCODE -ne 0) { throw "подпись установщика не удалась ($LASTEXITCODE)" }
          Remove-Item "$env:RUNNER_TEMP\codesign.pfx" -Force
          echo "установщик подписан"
      # Контрольные суммы артефактов в релиз: пользователь может сверить скачанное
      # (Get-FileHash == SHA256SUMS.txt), а для вендоров/поддержки есть эталонный хэш сборки.
      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          Get-FileHash bitaps-setup.exe, bitaps-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: |
            bitaps-setup.exe
            bitaps-windows-x64.zip
            SHA256SUMS.txt

  linux:
    needs: [test, prep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deps
        # libayatana-appindicator3-dev — для tray_manager (иконка в трее); без него linux-сборка падает
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2 libsecret-1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter config --enable-linux-desktop
      - run: flutter create --org com.bitapsvpn --platforms=linux --project-name bitaps_vpn .
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=BUILD_NUMBER=${{ needs.prep.outputs.bn }}
      # тот же движок для Linux: в bundle → попадает и в tar.gz, и в AppImage
      - name: VPN-движок (xray) в сборку
        run: |
          ver=v26.3.27
          sha=23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
          curl -sSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/$ver/Xray-linux-64.zip"
          echo "$sha  xray.zip" | sha256sum -c -
          unzip -o -q xray.zip -d xray-tmp
          dest=build/linux/x64/release/bundle
          install -m 0755 xray-tmp/xray "$dest/xray"
          # geoip.dat/geosite.dat обязательны: без них правила «РФ — мимо туннеля» не работают
          install -m 0644 xray-tmp/geoip.dat "$dest/geoip.dat"
          install -m 0644 xray-tmp/geosite.dat "$dest/geosite.dat"
          install -m 0644 xray-tmp/LICENSE "$dest/XRAY-LICENSE.txt"
          cp pkg/THIRD-PARTY.md "$dest/THIRD-PARTY.md"
          "$dest/xray" version | head -1
      - name: Portable tar.gz
        run: tar -czf bitaps-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: AppImage
        run: bash pkg/build-appimage.sh
      - name: build_number.txt (для авто-проверки обновлений в приложении)
        run: echo "${{ needs.prep.outputs.bn }}" > build_number.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: |
            bitaps-x86_64.AppImage
            bitaps-linux-x64.tar.gz
            build_number.txt

  android:
    needs: [test, prep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter create --org com.bitapsvpn --platforms=android --project-name bitaps_vpn .
      - name: Patch Android manifest (INTERNET, allowBackup=false) + minSdk 24
        run: |
          perl -0pi -e 's/(<manifest\b[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml && echo "INTERNET ok" || (echo "INTERNET MISSING" && exit 1)
          # allowBackup=false: не бэкапить локальную сессию/секреты приложения (flutter_secure_storage + plaintext-фолбэк) через adb/облачный backup
          perl -0pi -e 's/(<application\b)/$1 android:allowBackup="false"/ unless /android:allowBackup/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml && echo "allowBackup ok" || (echo "allowBackup MISSING" && exit 1)
          sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle 2>/dev/null || true
          # тот же grep-гейт, что у остальных патчей: сменится форма записи в шаблоне — узнаем сразу,
          # а не после того, как APK выйдет с дефолтным minSdk (для VPN-плагина он не проверялся)
          (grep -q "minSdk = 24" android/app/build.gradle.kts 2>/dev/null || grep -q "minSdkVersion 24" android/app/build.gradle 2>/dev/null) && echo "minSdk ok" || (echo "minSdk MISSING" && exit 1)
          # ── Распаковывать нативные библиотеки на диск (extractNativeLibs) ──
          # ОБЯЗАТЕЛЬНО. Современная упаковка (по умолчанию) держит .so внутри APK и не пишет их
          # в каталог lib/ — система грузит их прямо из архива. Для обычных библиотек это нормально,
          # но libtun2socks.so VPN-плагин ЗАПУСКАЕТ КАК ПРОГРАММУ, а запустить файл, которого нет
          # на диске, нельзя: «Cannot run program … No such file or directory».
          # Последствие ровно такое: xray стартует, системный VPN поднимается, а перемычки между
          # туннелем и движком нет — соединение есть, трафика нет, и сервис тут же гасится.
          # Проверено на живом устройстве: без этой строки трафик не идёт вообще.
          perl -0pi -e 's/(<application\b)/$1 android:extractNativeLibs="true"/ unless /extractNativeLibs/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml && echo "extractNativeLibs ok" || (echo "extractNativeLibs MISSING" && exit 1)
          # Манифест перебивается настройкой сборки, поэтому дублируем её в Gradle.
          for G in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$G" ] || continue
            grep -q "useLegacyPackaging" "$G" && continue
            case "$G" in
              *.kts) perl -0pi -e 's/(\n\s*buildTypes\s*\{)/\n    packaging { jniLibs { useLegacyPackaging = true } }\n$1/' "$G" ;;
              *)     perl -0pi -e 's/(\n\s*buildTypes\s*\{)/\n    packagingOptions { jniLibs { useLegacyPackaging = true } }\n$1/' "$G" ;;
            esac
          done
          grep -rq "useLegacyPackaging" android/app/build.gradle* && echo "useLegacyPackaging ok" || (echo "useLegacyPackaging MISSING" && exit 1)
          # compileSdk НЕ фиксируем: шаблон Flutter подставляет актуальный (сейчас 36), а он выше
          # требований и VPN-плагина (35), и остальных плагинов (app_links/shared_preferences → 36).
          # Жёсткая цифра здесь уже ломала сборку: занижала compileSdk до 35.
          # Манифест VPN-плагина приносит READ_EXTERNAL_STORAGE — чувствительное разрешение,
          # которое нам не нужно и которое пришлось бы обосновывать в Google Play. Убираем слиянием.
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/(<manifest\b)/$1 xmlns:tools="http:\/\/schemas.android.com\/tools"/ unless /xmlns:tools/' $M
          perl -0pi -e 's/(<manifest\b[^>]*>)/$1\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove"\/>/' $M
          grep -q 'tools:node="remove"' $M && echo "READ_EXTERNAL_STORAGE strip ok" || (echo "strip FAILED" && exit 1)
      - name: Patch Android manifest (deep-link bitaps:// + Quick Settings Tile)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # deep-link intent-filter внутри <activity> MainActivity: схема bitaps:// (import/login)
          perl -0pi -e 's#(</activity>)#            <intent-filter android:autoVerify="false">\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="bitaps"/>\n            </intent-filter>\n        $1#' $MANIFEST
          grep -q 'android:scheme="bitaps"' $MANIFEST && echo "deep-link ok" || (echo "deep-link MISSING" && exit 1)
          # Quick Settings Tile: сервис-плитка «bitaps VPN» в шторке (открывает приложение)
          perl -0pi -e 's#(</application>)#        <service\n            android:name=".BitapsTileService"\n            android:exported="true"\n            android:icon="\@mipmap/ic_launcher"\n            android:label="bitaps VPN"\n            android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">\n            <intent-filter>\n                <action android:name="android.service.quicksettings.action.QS_TILE"/>\n            </intent-filter>\n        </service>\n    $1#' $MANIFEST
          grep -q 'BitapsTileService' $MANIFEST && echo "QS tile ok" || (echo "QS tile MISSING" && exit 1)
          # Kotlin TileService: кладём рядом с MainActivity (пакет резолвим по каталогу MainActivity).
          # Тело кладём из base64 — heredoc в YAML block-scalar ломается на отступах терминатора.
          MAIN=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)
          if [ -z "$MAIN" ]; then echo "MainActivity.kt not found" && exit 1; fi
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package //; s/[[:space:]]*$//')
          DIR=$(dirname "$MAIN")
          printf 'package %s\n' "$PKG" > "$DIR/BitapsTileService.kt"
          # base64-строкой (одна строка → без heredoc, безопасно для YAML block-scalar отступов)
          B64=''
          echo "$B64" | base64 -d >> "$DIR/BitapsTileService.kt"
          echo "TileService written to $DIR (package $PKG)"
          # ── Разрешение на уведомления (Android 13+) ──
          # Служба VPN приоритетная и ОБЯЗАНА показать уведомление. Без разрешения показать его
          # нельзя, startForeground не вызывается, и система убивает службу через пять секунд
          # («did not then call Service.startForeground»). На устройстве это выглядело так:
          # подключился — и туннель тут же отвалился вместе с зависанием интерфейса.
          # Поэтому спрашиваем разрешение при ЗАПУСКЕ приложения, а не в момент подключения.
          perl -0pi -e 's/(<manifest\b[^>]*>)/$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>/ unless /POST_NOTIFICATIONS/' $MANIFEST
          grep -q 'POST_NOTIFICATIONS' $MANIFEST && echo "POST_NOTIFICATIONS ok" || (echo "POST_NOTIFICATIONS MISSING" && exit 1)
          # ── MainActivity — ЦЕЛИКОМ из репо (native_android/), НЕ base64-огрызок ──
          # В base64-варианте жил ТОЛЬКО запрос POST_NOTIFICATIONS: потерян канал
          # bitaps/system (isVpnActive/openVpnSettings), и CI-сборки вернули баг
          # «закрыл вкладку → открыл → пишет Отключено и реконнектит» — adoptRunningTunnel
          # не срабатывал, т.к. tunnelAlive() без нативного канала врёт «мёртв» (13.09).
          # Пакет подгоняем под фактический (как у TileService чуть выше).
          sed -i "1s/^package .*/package $PKG/" native_android/MainActivity.kt
          cp native_android/MainActivity.kt "$MAIN"
          grep -q 'POST_NOTIFICATIONS' "$MAIN" && echo "MainActivity ok" || (echo "MainActivity MISSING" && exit 1)
          grep -q 'isVpnActive' "$MAIN" && echo "isVpnActive ok" || (echo "isVpnActive MISSING" && exit 1)
      - run: flutter pub get
      # 29.08-патч pub-cache flutter_v2ray_client: весь IPv6 — в туннель (addRoute("::",0)).
      # TG-клиент любит IPv6-DC: без этого маршрута v6 уходит МИМО vpn напрямую, в РФ
      # блокируется — клиент висит, когда остальное работает. Патч локальный и теряется при
      # чистом pub get, поэтому накатываем здесь, СТРОГО после pub get, с grep-гейтом.
      - name: 'Патч flutter_v2ray_client — addRoute("::",0) (вис TG-клиента)'
        run: |
          F=$(find "$PUB_CACHE/hosted" -path "*flutter_v2ray_client*/android/src/main/java/*/v2ray/services/V2rayVPNService.java" | head -1)
          [ -n "$F" ] || { echo "V2rayVPNService.java не найден в pub-cache"; exit 1; }
          grep -q 'addRoute("::", 0)' "$F" && { echo "уже пропатчено апстримом"; exit 0; }
          perl -0pi -e 's/(\n(\s*)if \(v2rayConfig\.BYPASS_SUBNETS)/\n$2\/\/ v6 в туннель: TG любит IPv6-DC, иначе v6 уходит мимо VPN и клиент виснет (bitaps 29.08)\n$2builder.addRoute("::", 0);$1/' "$F"
          grep -q 'addRoute("::", 0)' "$F" || { echo "ПАТЧ НЕ ПРИМЕНИЛСЯ — форма кода в плагине изменилась"; exit 1; }
          echo "patched: $F"
      - run: dart run flutter_launcher_icons
      - run: yes | flutter doctor --android-licenses || true
      # split-per-abi: с VPN-движком внутри универсальный APK весит вдвое больше нужного.
      # x86_64 не собираем: его всё равно никто не публикует (эмуляторы на Google Play — ниша).
      # --build-number: versionCode для Google Play (требует монотонного роста между выкладками).
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-number=${{ needs.prep.outputs.bn }} --dart-define=BUILD_NUMBER=${{ needs.prep.outputs.bn }}
      # AAB для Google Play: консоль принимает только App Bundle (APK — для прямой раздачи).
      - run: flutter build appbundle --release --build-number=${{ needs.prep.outputs.bn }} --dart-define=BUILD_NUMBER=${{ needs.prep.outputs.bn }}
      # Store-вариант AAB: kStoreBuild=true убирает из пейвола внешние способы оплаты (бот/сайт) —
      # anti-steering по политике Play. Отличие только в dart-define, подпись та же. Первый AAB
      # уносим из выходного каталога, иначе вторая сборка перезапишет его.
      - run: mv build/app/outputs/bundle/release/app-release.aab /tmp/app-direct.aab
      - run: flutter build appbundle --release --build-number=${{ needs.prep.outputs.bn }} --dart-define=BUILD_NUMBER=${{ needs.prep.outputs.bn }} --dart-define=STORE_BUILD=true
      # ПОДПИСЬ ПОСТОЯННЫМ КЛЮЧОМ. Без неё Flutter подписывает релиз отладочным ключом, который
      # на раннере генерируется заново КАЖДУЮ сборку — и новая версия не встаёт поверх старой:
      # Android отклоняет установку по несовпадению подписи («приложение не установлено»).
      # Подписываем готовый файл через apksigner (он есть в build-tools раннера), а не правим
      # Gradle: android/ пересоздаётся `flutter create` на каждом прогоне, патч бы не пережил.
      - name: Подписать APK релизным ключом
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "нет секрета с ключом подписи"; exit 1; fi
          echo "$KS_B64" | base64 -d > /tmp/release.p12
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$APKSIGNER" sign --ks /tmp/release.p12 --ks-type PKCS12 \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" "$f"
            "$APKSIGNER" verify --print-certs "$f" | grep -E "Signer #1 certificate DN|SHA-256" | head -2
          done
          # AAB для Google Play: apksigner НЕ умеет AAB (Missing AndroidManifest) — подписываем jarsigner,
          # это стандартная подпись App Bundle, принимаемая консолью. Подписываем ОБА варианта:
          # /tmp/app-direct.aab (прямая раздача) и свежий app-release.aab (STORE_BUILD, в консоль).
          JARSIGNER=$(ls -d "$JAVA_HOME"/bin/jarsigner "$ANDROID_HOME"/java/*/bin/jarsigner 2>/dev/null | head -1)
          [ -x "$JARSIGNER" ] || JARSIGNER=jarsigner
          for AAB in /tmp/app-direct.aab build/app/outputs/bundle/release/app-release.aab; do
            "$JARSIGNER" -keystore /tmp/release.p12 -storetype PKCS12 -storepass:env KS_PASS -keypass:env KS_PASS \
              "$AAB" "$KS_ALIAS"
            "$JARSIGNER" -verify -certs "$AAB" 2>/dev/null | grep -E "X.509|SHA-256" | head -2 || true
          done
          rm -f /tmp/release.p12
      - name: APK/AAB для релиза (arm64 — основной, armeabi — старые устройства, AAB — Google Play)
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk bitaps.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk bitaps-armv7.apk
          cp /tmp/app-direct.aab bitaps.aab
          cp build/app/outputs/bundle/release/app-release.aab bitaps-play.aab
          ls -la bitaps.apk bitaps-armv7.apk bitaps.aab bitaps-play.aab
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: |
            bitaps.apk
            bitaps-armv7.apk
            bitaps.aab
            bitaps-play.aab


  # macOS: раздаём DMG напрямую (без App Store), поэтому подпись — ad-hoc. Пользователь один раз
  # разрешает запуск в «Системные настройки → Конфиденциальность и безопасность».
  # Песочница ОТКЛЮЧЕНА намеренно: приложению нужно запускать вложенный движок и менять
  # системный прокси — под sandbox это невозможно.
  macos:
    needs: [test, prep]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter config --enable-macos-desktop
      - run: flutter create --org com.bitapsvpn --platforms=macos --project-name bitaps_vpn .
      - name: Отключить песочницу (иначе движок не запустится)
        run: |
          for F in macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements; do
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$F" 2>/dev/null               || /usr/libexec/PlistBuddy -c "Add :com.apple.security.app-sandbox bool false" "$F"
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "$F" 2>/dev/null               || /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$F"
          done
          grep -A1 app-sandbox macos/Runner/Release.entitlements
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=BUILD_NUMBER=${{ needs.prep.outputs.bn }}
      - name: VPN-движок (xray) в бандл — универсальный бинарь arm64+x86_64
        run: |
          ver=v26.3.27
          sha_arm=2e93a67e8aa1936ecefb307e120830fcbd4c643ab9b1c46a2d0838d5f8409eaf
          sha_x64=f5b0471d3459eff1b82e48af0aeac186abcc3298210070afbbbd8437a4e8b203
          curl -sSL -o xray-arm.zip "https://github.com/XTLS/Xray-core/releases/download/$ver/Xray-macos-arm64-v8a.zip"
          curl -sSL -o xray-x64.zip "https://github.com/XTLS/Xray-core/releases/download/$ver/Xray-macos-64.zip"
          echo "$sha_arm  xray-arm.zip" | shasum -a 256 -c -
          echo "$sha_x64  xray-x64.zip" | shasum -a 256 -c -
          unzip -o -q xray-arm.zip -d xray-arm && unzip -o -q xray-x64.zip -d xray-x64
          APP=build/macos/Build/Products/Release/bitaps_vpn.app
          dest="$APP/Contents/MacOS"
          # приложение Flutter собирается универсальным — движок тоже делаем универсальным,
          # иначе на Intel-маках он просто не запустится
          lipo -create xray-arm/xray xray-x64/xray -output "$dest/xray"
          chmod 0755 "$dest/xray"
          cp xray-arm/geoip.dat xray-arm/geosite.dat "$dest/"
          cp xray-arm/LICENSE "$APP/Contents/Resources/XRAY-LICENSE.txt"
          lipo -info "$dest/xray"
          "$dest/xray" version | head -1
      - name: Подпись (ad-hoc) и DMG
        run: |
          APP=build/macos/Build/Products/Release/bitaps_vpn.app
          # вложенный бинарь подписываем ПЕРВЫМ: hardened runtime не запустит неподписанного ребёнка
          codesign --force --timestamp=none --sign - "$APP/Contents/MacOS/xray"
          codesign --force --deep --timestamp=none --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -sf /Applications dmg/Applications
          hdiutil create -volname "bitaps VPN" -srcfolder dmg -ov -format UDZO bitaps-macos.dmg
          ls -la bitaps-macos.dmg
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: bitaps-macos.dmg

  # iOS: дым-тест компиляции без подписи (Flutter-приложение + наш AppDelegate.swift).
  # Платформенные папки в git не хранятся (см. .gitignore) — ios/ генерируется заново,
  # а наши нативные файлы применяются поверх из native_ios/ (паттерн Android-манифеста).
  # Подпись и выгрузка в App Store — через команду владельца в Xcode (см. native_ios/README-IOS.md).
  ios:
    needs: [test, prep]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter create --org com.bitapsvpn --platforms=ios --project-name bitaps_vpn .
      - name: Применить нативную сторону (мост + PacketTunnel)
        run: |
          cp native_ios/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp native_ios/Runner.entitlements ios/Runner/Runner.entitlements
          cp -R native_ios/PacketTunnel ios/PacketTunnel
          grep -q "app.bitaps.vpn/control" ios/Runner/AppDelegate.swift || (echo "AppDelegate не применён" && exit 1)
          echo OK
      - run: flutter pub get
      # Пакет flutter_v2ray_client переименовал плагин, но не podspec: podhelper ищет
      # flutter_v2ray_client.podspec, а лежит flutter_v2ray.podspec — pod install падает.
      # Копируем на ожидаемое имя прямо в pub-cache (содержимое корректное, API-compat stub).
      - name: Починить podspec flutter_v2ray_client для iOS
        run: |
          P="$(find "$PUB_CACHE" -maxdepth 4 -type d -name ios -path "*flutter_v2ray_client*" | head -1)"
          echo "pkg ios dir: $P"
          [ -n "$P" ] || { echo "пакет не найден в pub-cache"; exit 1; }
          [ -f "$P/flutter_v2ray_client.podspec" ] || cp "$P/flutter_v2ray.podspec" "$P/flutter_v2ray_client.podspec"
          ls "$P"
      - run: flutter build ios --release --no-codesign --dart-define=BUILD_NUMBER=${{ needs.prep.outputs.bn }}
